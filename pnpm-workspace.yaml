minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - ioredis@5.10.0

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 267840
strictPeerDependencies: true
shellEmulator: true

allowBuilds:
  '@parcel/watcher': true
  bcrypt: true
  better-sqlite3: false
  core-js: false
  esbuild: true
  unrs-resolver: false
  vue-demi: true
