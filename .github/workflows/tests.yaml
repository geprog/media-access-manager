name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm typecheck

  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm spelling

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          run_install: true
      - run: pnpm test run

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers and system dependencies
        run: pnpm playwright:install

      # The suite runs against the image rather than against a server started
      # in this job, so it exercises what a deployment actually runs: the same
      # base image, the same native modules, the same fonts. `publish.yaml`
      # builds the image the same way.
      - name: Build the app
        run: pnpm run build

      - name: Build the Docker image
        run: docker build --tag media-access-manager:e2e .

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          E2E_DOCKER_IMAGE: media-access-manager:e2e

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
